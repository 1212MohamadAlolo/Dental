<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>Bookmark Storage</title>
</head>
<body>
<script>
(() => {
  'use strict';
  const KEY = 'oral-health-bookmarks-v1';

  function readData() {
    try {
      const parsed = JSON.parse(localStorage.getItem(KEY) || '[]');
      return Array.isArray(parsed) ? parsed : [];
    } catch (_) {
      return [];
    }
  }

  function writeData(data) {
    try {
      localStorage.setItem(KEY, JSON.stringify(Array.isArray(data) ? data : []));
      return true;
    } catch (_) {
      return false;
    }
  }

  window.addEventListener('message', (event) => {
    const message = event.data || {};
    if (!message || typeof message.type !== 'string') return;

    if (message.type === 'OH_BOOKMARKS_GET') {
      event.source?.postMessage({
        type: 'OH_BOOKMARKS_RESPONSE',
        requestId: message.requestId,
        ok: true,
        data: readData()
      }, '*');
      return;
    }

    if (message.type === 'OH_BOOKMARKS_SET') {
      const ok = writeData(message.data);
      event.source?.postMessage({
        type: 'OH_BOOKMARKS_RESPONSE',
        requestId: message.requestId,
        ok,
        data: readData()
      }, '*');
      return;
    }

    if (message.type === 'OH_BOOKMARKS_CLEAR') {
      const ok = writeData([]);
      event.source?.postMessage({
        type: 'OH_BOOKMARKS_RESPONSE',
        requestId: message.requestId,
        ok,
        data: []
      }, '*');
    }
  });
})();
</script>
</body>
</html>
